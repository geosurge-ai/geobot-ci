name: Run
description: |
  Run a binary and record the success.

  Expects `setup` to have run earlier in the same job: it exports NIX_SSHOPTS
  and GIT_SSH_COMMAND into $GITHUB_ENV, which every later step inherits, so
  repeating it here would be the same work twice.

inputs:
  bin:
    required: true
    description: "Full path to the binary to run, from check-if-ran's `bin` output"
  timeout:
    required: true
    description: "Seconds the binary may run before it is killed"
  retries:
    required: false
    default: "0"
    description: "Number of retry attempts on failure"

runs:
  using: composite
  steps:
    # Concurrency queues several jobs on one key. After the first finishes and
    # records its bin, the ones behind it would repeat work already done, so
    # re-read the set here rather than trusting the decision made before the
    # queue. The build has already run either way, which is what keeps this
    # revision's closure rooted.
    #
    # Example with 3 jobs having the same bin=X:
    # 1. Job A (bin=X) runs
    # 2. Job B (bin=X) waits in queue
    # 3. Job C (bin=X) waits in queue
    # 4. Job A finishes, records bin=X as succeeded
    # 5. Job B starts, re-checks succeed list -> finds bin=X -> skips
    # 6. Job C starts, re-checks succeed list -> finds bin=X -> skips
    - name: Check if already succeeded
      id: check
      shell: bash
      env:
        BIN: ${{ inputs.bin }}
      run: |
        # Membership in a set of opaque keys, so a file per key: creating one is
        # atomic, testing one needs no lock, and expiry is a find. The directory
        # is on the runners' shared volume, which every runner mounts.
        DIR=/var/cache/github-runners-shared/geobot-ci-succeeded
        KEY=$(printf '%s' "$BIN" | sha256sum | cut -d' ' -f1)
        if [ -e "$DIR/$KEY" ]; then
          echo "Already succeeded, skipping"
          echo "skip=true" >> $GITHUB_OUTPUT
        else
          echo "skip=false" >> $GITHUB_OUTPUT
        fi

    - name: Run
      id: run
      if: steps.check.outputs.skip != 'true'
      shell: bash
      env:
        BIN: ${{ inputs.bin }}
        TIMEOUT: ${{ inputs.timeout }}
        RETRIES: ${{ inputs.retries }}
      run: |
        ATTEMPT=0
        MAX_ATTEMPTS=$((RETRIES + 1))
        while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
          ATTEMPT=$((ATTEMPT + 1))
          echo "Running attempt $ATTEMPT of $MAX_ATTEMPTS..."
          if timeout "$TIMEOUT" "$BIN"; then
            echo "Success!"
            exit 0
          else
            EXIT_CODE=$?
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "Failed with exit code $EXIT_CODE, retrying..."
              sleep 5
            else
              echo "Failed after $MAX_ATTEMPTS attempts"
              exit $EXIT_CODE
            fi
          fi
        done

    - name: Record success
      if: steps.check.outputs.skip != 'true'
      shell: bash
      env:
        BIN: ${{ inputs.bin }}
      run: |
        DIR=/var/cache/github-runners-shared/geobot-ci-succeeded
        KEY=$(printf '%s' "$BIN" | sha256sum | cut -d' ' -f1)
        mkdir -p "$DIR"
        # Written aside and renamed so a reader never sees a half-written marker.
        # The body is the path it stands for, so the directory can be read back.
        printf '%s\n' "$BIN" > "$DIR/.tmp.$$"
        mv -f "$DIR/.tmp.$$" "$DIR/$KEY"
        echo "Recorded $BIN"
        # Expiry lives with the writer because nothing else walks this directory.
        # A dropped entry re-runs a job; it can never cause a wrong skip.
        find "$DIR" -type f -mtime +30 -delete
