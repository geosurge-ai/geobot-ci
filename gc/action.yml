name: GC
description: |
  Prune gcroot directories on remote hosts to their newest N entries, then
  garbage-collect the hosts named in `collect_hosts`.

  The roots are written by the job that builds or receives the paths, while it
  still holds them; this action only decides how many of them to keep. Nothing
  here resolves a store path, so a path is protected from the moment it exists
  rather than from the next run of this action.

  Each target line:
    <ssh_target> <gcroot_dir> <keep> <host_pubkey>

  `keep` is how many entries of that directory to keep, newest first by mtime;
  the rest are deleted.

  Example:
    root@34.13.40.72 /var/cache/github-runners-shared/geobot-ci-gcroots 100 ssh-ed25519 AAAAC3NzaC1...

  Multiple targets sharing an ssh_target are pruned in one SSH session.
  Refuses to collect on a host where a declared directory is missing or empty,
  since that means the job that writes it never ran and the store has roots we
  cannot see.

inputs:
  geobot_ssh_key:
    required: true
    description: "SSH private key for build servers and GitHub access"
  targets:
    required: true
    description: "Newline-separated GC targets — see action description"
  collect_hosts:
    required: false
    default: ""
    description: |
      Space/newline-separated list of ssh_targets (matching the first field of
      a target line) on which to actually run `nix-collect-garbage` after
      pruning. Any host not listed only has its gcroot directories pruned and
      is never swept. Empty (default) collects nowhere — useful for holding a
      host's retained set to a bound without sweeping it. Each entry must match
      a known ssh_target or the run aborts (typo guard).
  nix_collect_garbage_args:
    required: false
    default: ""
    description: |
      Extra args forwarded verbatim to `nix-collect-garbage` (e.g.
      "--delete-older-than 7d" or "--max-freed 50G"). Empty by default,
      which means `nix-collect-garbage` runs with no extra flags.

runs:
  using: composite
  steps:
    - uses: geosurge-ai/geobot-ci/setup@ca9ed91ef783e96b6db1050d8b40ab916ee55ce9
      with:
        geobot_ssh_key: ${{ inputs.geobot_ssh_key }}

    - name: Run GC
      id: gc
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
        COLLECT_HOSTS: ${{ inputs.collect_hosts }}
        NIX_COLLECT_GARBAGE_ARGS: ${{ inputs.nix_collect_garbage_args }}
      run: bash "$GITHUB_ACTION_PATH/gc.sh"
